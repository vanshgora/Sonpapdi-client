<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonpapdi Surprise 😂</title><style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

.popup {
    background: white;
    color: #333;
    width: 90%;
    max-width: 400px;
    padding: 35px 25px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: popup 0.7s ease;
}

@keyframes popup {
    from {
        transform: scale(0.2) rotate(-15deg);
        opacity: 0;
    }
    to {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

.sweet {
    font-size: 90px;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

h1 {
    color: #e67e22;
    margin: 15px 0;
    font-size: 30px;
}

p {
    font-size: 16px;
    margin: 15px 0;
    line-height: 1.6;
}

button {
    background: linear-gradient(45deg, #ff9800, #ff5722);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 5px 20px #ff980088;
}

#message {
    display: none;
    margin-top: 20px;
    color: #e67e22;
    font-weight: bold;
    font-size: 20px;
}

.confetti {
    position: absolute;
    top: -20px;
    font-size: 25px;
    animation: fall 4s linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}
</style></head><body><div class="popup">
    <div class="sweet">🍬</div><h1>Surprise!!! 🎉</h1>

<p>
    Congratulations!<br>
    You have officially won...
</p>

<h2 style="color:#e67e22;">1 KG SONPAPDI 😂</h2>

<p>Because nobody escapes Sonpapdi season!</p>

<button onclick="reveal()">Claim Your Gift 🎁</button>

<div id="message">
    😂 SONPAPDI DELIVERED!<br>
    No Returns. No Exchanges.
</div>

</div><script>
function reveal() {
    document.getElementById("message").style.display = "block";

    for(let i = 0; i < 40; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.innerHTML = ["🍬","🎉","😂","🎊"][Math.floor(Math.random()*4)];
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.animationDuration = (2 + Math.random()*3) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }
}
</script></body>
</html>
